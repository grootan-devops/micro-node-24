# Trivy suppressions for the Node.js 24 micro base image.
#
# Every entry below is in a dependency vendored inside the npm CLI that ships
# with Node.js (/usr/local/node/lib/node_modules/npm/node_modules/...). These
# copies are loaded only while the npm command itself runs. They are not
# Node.js's built-in undici/fetch and are not on an application's require
# path. They are accepted until a Node.js/npm release bundles the patched
# versions; the scan fails on a stale entry, so drop each one when the
# upgraded npm lands.
image:
  - id: "CVE-2026-19534"
    reason: "undici 6.28.0 vendored by the npm CLI (patched in 6.28.1). The DoS needs a WebSocket server to answer with an unrequested subprotocol; npm only makes HTTPS requests to the configured registry and never opens WebSockets, and applications use Node.js's built-in undici, not this copy. Accepted until the bundled npm ships undici >= 6.28.1."
  - id: "CVE-2026-85024"
    reason: "undici 6.28.0 vendored by the npm CLI (patched in 6.28.1). The DoS is in WebSocket permessage-deflate decompression; npm never opens WebSockets, and applications use Node.js's built-in undici, not this copy. Accepted until the bundled npm ships undici >= 6.28.1."
  - id: "CVE-2026-18540"
    reason: "undici 6.28.0 vendored by the npm CLI (patched in 6.28.1). Response splitting through undici's retry interceptor needs attacker-controlled response headers; this copy only serves npm's own requests to the trusted, configured registry, and applications do not load it. Accepted until the bundled npm ships undici >= 6.28.1."
  - id: "CVE-2026-104844"
    reason: "postcss-selector-parser 7.1.4 vendored by the npm CLI (patched in 7.1.6), used only by the `npm query` command. The DoS needs a crafted selector passed to `npm query`, which no build step or running container does, and application code never loads this copy. Accepted until the bundled npm ships postcss-selector-parser >= 7.1.6."
