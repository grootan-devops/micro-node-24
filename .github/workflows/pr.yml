name: CI · Pull Request
run-name: "CI · ${{ github.event_name }} · ${{ github.sha }}"

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  init:
    uses: grootan-devops/github-ci-library/.github/workflows/init.yml@1.0.0
    secrets: inherit
    permissions:
      contents: read
      actions: read
      pull-requests: read
    with:
      ignore-docker: "false"
      ignore-chart: "true"

  lint:
    uses: grootan-devops/github-ci-library/.github/workflows/lint.yml@1.0.0
    secrets: inherit
    permissions:
      contents: read
    with:
      lint-md-files: "*.md"

  secret-scan:
    uses: grootan-devops/github-ci-library/.github/workflows/secret-scanning.yml@1.0.0
    secrets: inherit
    permissions:
      contents: read

  trivy-cache:
    uses: grootan-devops/github-ci-library/.github/workflows/trivy-cache.yml@1.0.0
    secrets: inherit
    permissions:
      contents: read
      actions: write
    with:
      enable-java-db: false

  image:
    needs: init
    uses: grootan-devops/github-ci-library/.github/workflows/buildah.yml@1.0.0
    secrets: inherit
    permissions:
      contents: read
      packages: write
    with:
      image-tag: ${{ needs.init.outputs.image-push-tag }}
      image-repository: ${{ needs.init.outputs.image-push-repository }}
      base-image-repo: grootantech/micro-root
      # renovate: datasource=gitlab-tags depName=devops/container-image/base/micro-root
      base-image-tag: "1.0.0"
      install-packages: "grep libstdc++"
      required-packages: "grep libstdc++"
      container-path-env: "/usr/local/node/bin"
      container-entrypoint: '["/usr/bin/dumb-init", "--"]'
      container-cmd: '["node"]'

  image-test:
    needs: image
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3
        with:
          registry: registry-1.docker.io
          username: ${{ secrets.IMAGE_REGISTRY_USERNAME }}
          password: ${{ secrets.IMAGE_REGISTRY_PASSWORD }}
      - name: Run image smoke test as non-root
        env:
          IMAGE_REF: ${{ needs.image.outputs.image-ref-digest }}
        run: >-
          docker run --rm --privileged --user 10001:10001 --entrypoint /bin/bash
          -v "${PWD}:/tmp/image-test:ro" "${IMAGE_REF}"
          -c 'cd /tmp/image-test && ./ci_image_test.sh'

  image-scan:
    needs: [image, trivy-cache]
    uses: grootan-devops/github-ci-library/.github/workflows/scan.yml@1.0.0
    secrets: inherit
    permissions:
      contents: read
      checks: write
    with:
      scan-type: image
      image-ref: ${{ needs.image.outputs.image-ref-digest }}

  check:
    needs: init
    uses: grootan-devops/github-ci-library/.github/workflows/check.yml@1.0.0
    secrets: inherit
    permissions:
      contents: read
    with:
      tag: ${{ needs.init.outputs.tag }}
      image-tag: ${{ needs.init.outputs.image-tag }}
      image-repository: ${{ needs.init.outputs.image-repository }}
