name: Build · Manual Image Verification
run-name: "CI · ${{ github.event_name }} · ${{ github.sha }}"

on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  init:
    uses: grootan-devops/github-ci-library/.github/workflows/init.yml@1.6.0
    secrets: inherit
    permissions:
      contents: read
      actions: read
      pull-requests: read
    with:
      ignore-docker: "false"
      ignore-chart: "true"

  trivy-cache:
    uses: grootan-devops/github-ci-library/.github/workflows/trivy-cache.yml@1.6.0
    secrets: inherit
    permissions:
      contents: read
      actions: write
    with:
      enable-java-db: false

  image:
    needs: init
    uses: grootan-devops/github-ci-library/.github/workflows/buildah.yml@1.6.0
    secrets: inherit
    permissions:
      contents: read
      packages: write
    with:
      image-tag: ${{ needs.init.outputs.image-push-tag }}
      image-repository: ${{ needs.init.outputs.image-push-repository }}
      base-image-repo: docker.io/grootantech/micro-root
      # renovate: datasource=github-tags depName=grootan-devops/micro-root
      base-image-tag: "1.0.0"
      install-packages: "grep libstdc++"
      required-packages: "grep libstdc++"
      container-path-env: "/usr/local/node/bin"
      container-entrypoint: '["/usr/bin/dumb-init", "--"]'
      container-cmd: '["node"]'
      test: true
      test-script: ci_image_test.sh
      test-path: "."
      test-shell: bash

  image-scan:
    needs: [image, trivy-cache]
    uses: grootan-devops/github-ci-library/.github/workflows/scan.yml@1.6.0
    secrets: inherit
    permissions:
      contents: read
      checks: write
    with:
      scan-type: image
      image-ref: ${{ needs.image.outputs.image-ref-digest }}
